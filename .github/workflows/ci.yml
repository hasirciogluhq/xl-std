name: ci

# Tests the standard library against the xlang compiler `xlc`: the newest stable release of the compiler when it has one, otherwise
# its newest pre-release (see .github/scripts/install-xlc.sh). Also called by the release workflow before a release is published.
#
# Reading the compiler repository needs a token while that repository is private: add the secret XLC_TOKEN (contents: read on
# hasirciogluhq/xlc). Without it the workflow's own token is used, which works once the compiler repository is public.
#
# Manual run: `workflow_dispatch` with `xlc_version` (for example v1.0.0-rc.1) pins a compiler release.

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_call:
    inputs:
      xlc_version:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      xlc_version:
        description: "Compiler release tag to use instead of the newest one (optional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XLC_VERSION: ${{ inputs.xlc_version }}
  GH_TOKEN: ${{ secrets.XLC_TOKEN || github.token }}

jobs:
  # The comment tags follow the rules of STD-TAGS.md, and the collected view is the one the
  # source produces. Runs on one host: it is a text scan, not a compile.
  tags:
    name: comment tags
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: ./scripts/tags.sh check
      - name: collected view is up to date
        run: |
          ./scripts/tags.sh sync
          git diff --exit-code -- STD-TAGS.md

  # The whole stdlib must type-check for every target it supports, whatever the host is.
  check:
    name: type-check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/install-xlc.sh
      - name: xlc --check src/index.xl
        run: xlc src/index.xl --check -DfeatureDefaultAllocator=true --target ${{ matrix.target }}

  # Unit suites and end-to-end programs, built and run natively on each host. The Linux hosts also run the container legs of run.sh.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/install-xlc.sh
      # xlc links Mach-O executables with LLVM's `ld64.lld`, which the macOS runners do not have.
      - name: Linker (macOS)
        if: runner.os == 'macOS'
        run: brew install lld
      # The container legs link the other CPU's executables on the host: only LLVM's `ld.lld` links every CPU.
      - name: Linker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lld
      - name: Emulation for the foreign-architecture container legs
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
      - name: Unit suites
        run: test/unit/run.sh
      - name: End-to-end programs
        run: test/e2e/run.sh

  # Windows has no bash-driven e2e leg: build the process test natively and run it (it starts itself as the child, so it needs no tool).
  windows:
    name: test (windows)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/install-xlc.sh
      - name: Process test
        run: |
          xlc test/e2e/process.xl -M std="$PWD/src" --import std -DfeatureDefaultAllocator=true -o process.exe
          ./process.exe
